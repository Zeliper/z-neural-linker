[package]
name = "nl-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = ".nlapp 번들 읽기/쓰기 · 런타임 바이너리 첨부 · 배포 아카이브"
# crates.io 에 올리지 않는다. 이 저장소 안에서만 쓰는 크레이트다.
# 이 줄이 있어야 `cargo deny` 가 워크스페이스 안 `path` 의존성을 와일드카드로 잡지 않는다
# (발행 가능한 크레이트에는 `allow-wildcard-paths` 가 적용되지 않는다).
publish = false

[dependencies]
nl-core = { path = "../nl-core" }
nl-update = { path = "../nl-update" }
serde_json.workspace = true
anyhow.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
sha2.workspace = true
sha1.workspace = true
semver.workspace = true
image.workspace = true
ureq.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
log.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
