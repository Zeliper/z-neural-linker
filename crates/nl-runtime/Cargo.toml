[package]
name = "nl-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neural Linker 배포판 실행기 (번들 로드 · GUI · 파이프라인 · 추론)"
# crates.io 에 올리지 않는다. 이 저장소 안에서만 쓰는 크레이트다.
# 이 줄이 있어야 `cargo deny` 가 워크스페이스 안 `path` 의존성을 와일드카드로 잡지 않는다
# (발행 가능한 크레이트에는 `allow-wildcard-paths` 가 적용되지 않는다).
publish = false

[[bin]]
name = "nl-runtime"
path = "src/main.rs"

[dependencies]
nl-core = { path = "../nl-core" }
nl-engine = { path = "../nl-engine" }
nl-io = { path = "../nl-io" }
nl-gui = { path = "../nl-gui" }
nl-bundle = { path = "../nl-bundle" }
nl-update = { path = "../nl-update" }
serde.workspace = true
chrono.workspace = true
semver.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
crossbeam-channel.workspace = true
zip.workspace = true
image.workspace = true
eframe = { workspace = true, features = ["accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui_extras = { workspace = true, features = ["image"] }
egui.workspace = true
egui_plot.workspace = true
winit.workspace = true
tempfile.workspace = true
directories.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
egui_kittest.workspace = true

[build-dependencies]
winresource.workspace = true
