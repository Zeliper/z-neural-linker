[package]
name = "nl-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neural Linker 빌더 GUI (eframe/egui, glow)"
# crates.io 에 올리지 않는다. 이 저장소 안에서만 쓰는 크레이트다.
# 이 줄이 있어야 `cargo deny` 가 워크스페이스 안 `path` 의존성을 와일드카드로 잡지 않는다
# (발행 가능한 크레이트에는 `allow-wildcard-paths` 가 적용되지 않는다).
publish = false

[[bin]]
name = "nl-app"
path = "src/main.rs"

[dependencies]
nl-core = { path = "../nl-core" }
nl-engine = { path = "../nl-engine" }
nl-io = { path = "../nl-io" }
nl-gui = { path = "../nl-gui" }
nl-bundle = { path = "../nl-bundle" }
nl-update = { path = "../nl-update" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
sha2.workspace = true
semver.workspace = true
ureq.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
image.workspace = true
csv.workspace = true
# glow = OpenGL 백엔드 (trust-pms 와 동일한 이유: wgpu 백엔드의 Vulkan ICD 폴백 중 repaint 유실).
eframe = { workspace = true, features = ["accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui_extras = { workspace = true, features = ["image"] }
egui_plot.workspace = true
winit.workspace = true
rfd.workspace = true

tempfile.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }

[build-dependencies]
winresource.workspace = true
