[package]
name = "nl-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "자동 업데이트 코어: 매니페스트 확인 · 서명 검증 · 스트리밍 다운로드 · 적용 (GUI 무의존)"
# crates.io 에 올리지 않는다. 이 저장소 안에서만 쓰는 크레이트다.
# 이 줄이 있어야 `cargo deny` 가 워크스페이스 안 `path` 의존성을 와일드카드로 잡지 않는다
# (발행 가능한 크레이트에는 `allow-wildcard-paths` 가 적용되지 않는다).
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
semver.workspace = true
sha2.workspace = true
ureq.workspace = true
minisign-verify.workspace = true
crossbeam-channel.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
minisign.workspace = true
tiny_http.workspace = true

# 서명 키 도구. 예제 대상이라 `minisign` 이 배포 바이너리의 의존성 트리에 들어가지 않는다
# (minisign 은 scrypt·rpassword 를 끌어온다 — 런타임에 필요 없는 것들이다).
# `test = true` 라야 `cargo test -p nl-update` 가 이 파일의 시험까지 돌린다.
[[example]]
name = "nl-keygen"
test = true
