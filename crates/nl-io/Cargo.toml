[package]
name = "nl-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "화면 캡처 · 입력 시뮬레이션 · HTTP/WS/stdio · 자원 조회 어댑터"

[dependencies]
nl-core = { path = "../nl-core" }
nl-engine = { path = "../nl-engine" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
image.workspace = true
ureq.workspace = true
tungstenite.workspace = true
sysinfo.workspace = true
# 녹화 meta.json 의 시작 시각(RFC 3339)
chrono.workspace = true
# 인바운드 HTTP 서버 (`Source::HttpServer`) + 시험용 로컬 서버
tiny_http.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
libwayshot.workspace = true
zbus.workspace = true
enigo = { workspace = true, features = ["x11rb", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
xcap.workspace = true
enigo = { workspace = true, features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
xcap.workspace = true
enigo = { workspace = true, features = [] }
