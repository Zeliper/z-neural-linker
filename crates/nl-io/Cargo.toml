[package]
name = "nl-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "화면 캡처 · 입력 시뮬레이션 · HTTP/WS/stdio · 자원 조회 어댑터"
# crates.io 에 올리지 않는다. 이 저장소 안에서만 쓰는 크레이트다.
# 이 줄이 있어야 `cargo deny` 가 워크스페이스 안 `path` 의존성을 와일드카드로 잡지 않는다
# (발행 가능한 크레이트에는 `allow-wildcard-paths` 가 적용되지 않는다).
publish = false

[dependencies]
nl-core = { path = "../nl-core" }
nl-engine = { path = "../nl-engine" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
image.workspace = true
ureq.workspace = true
tungstenite.workspace = true
# `Source::HttpServer` 의 tls 옵션. 인증서가 없으면 한 줄도 돌지 않는다.
rustls.workspace = true
sysinfo.workspace = true
# 녹화 meta.json 의 시작 시각(RFC 3339)
chrono.workspace = true

[dev-dependencies]
# `http.rs` 의 왕복 시험이 띄우는 로컬 서버. 인바운드 서버(`Source::HttpServer`)는
# `src/httpd.rs` 가 std 만으로 직접 구현하므로 일반 의존성에는 없다.
tiny_http.workspace = true
# TLS 왕복 시험용 자체 서명 인증서.
rcgen.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
libwayshot.workspace = true
zbus.workspace = true
enigo = { workspace = true, features = ["x11rb", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
xcap.workspace = true
enigo = { workspace = true, features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
xcap.workspace = true
enigo = { workspace = true, features = [] }
