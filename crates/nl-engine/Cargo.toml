[package]
name = "nl-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "burn 기반 런타임 정의 그래프 인터프리터 · 장치 · 학습 · 체크포인트 · 추론"
# crates.io 에 올리지 않는다. 이 저장소 안에서만 쓰는 크레이트다.
# 이 줄이 있어야 `cargo deny` 가 워크스페이스 안 `path` 의존성을 와일드카드로 잡지 않는다
# (발행 가능한 크레이트에는 `allow-wildcard-paths` 가 적용되지 않는다).
publish = false

[dependencies]
nl-core = { path = "../nl-core" }
burn = { workspace = true, features = ["std", "ndarray", "wgpu", "autodiff", "vulkan"] }
safetensors.workspace = true
prost.workspace = true
base64.workspace = true
memmap2.workspace = true
wgpu.workspace = true
pollster.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rayon.workspace = true
chrono.workspace = true
csv.workspace = true
image.workspace = true
rand = "0.9"
rand_chacha = "0.9"
# `onnx-import` 기능을 켤 때만 들어간다. 끄면 의존성 트리에 나타나지 않는다.
tract-onnx = { workspace = true, optional = true }

[dev-dependencies]
# ONNX 내보내기 왕복 검증 전용. 배포 바이너리에는 들어가지 않는다.
tract-onnx.workspace = true

[features]
default = []
# ONNX **가져오기**(추론 전용). 기본 꺼짐 — 켜면 배포 바이너리가 34 MiB 늘어난다(+46%).
# `tract-onnx` 는 기능 플래그로 줄일 수 없다(optional 의존성이 하나도 없다).
# 실측과 판단 근거는 docs/research/onnx-2026-09-14.md.
onnx-import = ["dep:tract-onnx"]
