[package]
name = "nl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neural Linker 명령줄 도구 — 헤드리스 검사·학습·추론·실행·녹화·빌드"
# crates.io 에 올리지 않는다. 이 저장소 안에서만 쓰는 크레이트다.
# 이 줄이 있어야 `cargo deny` 가 워크스페이스 안 `path` 의존성을 와일드카드로 잡지 않는다
# (발행 가능한 크레이트에는 `allow-wildcard-paths` 가 적용되지 않는다).
publish = false

[[bin]]
name = "nl"
path = "src/main.rs"

[dependencies]
nl-core = { path = "../nl-core" }
nl-engine = { path = "../nl-engine" }
nl-io = { path = "../nl-io" }
nl-bundle = { path = "../nl-bundle" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
env_logger.workspace = true
crossbeam-channel.workspace = true
sha2.workspace = true
# `nl infer --image` 가 이미지를 읽는다
image.workspace = true
# `nl tls-cert` 가 자체 서명 인증서를 만든다 (시험 전용이 아니라 일반 의존성).
rcgen.workspace = true

[dev-dependencies]
# 종단 테스트가 배포판에 HTTP 요청을 보낸다 (nl-io 는 이미 일반 의존성이라 새로 추가되는 것은 없다).

[target.'cfg(unix)'.dependencies]
libc.workspace = true
