[workspace]
resolver = "2"
members = [
    "crates/nl-core",
    "crates/nl-engine",
    "crates/nl-io",
    "crates/nl-gui",
    "crates/nl-bundle",
    "crates/nl-update",
    "crates/nl-app",
    "crates/nl-runtime",
    "crates/nl-cli",
    "tools/uitest/vseat",
]
# ONNX protobuf 코드 생성기. 결과(`crates/nl-engine/src/onnx/pb.rs`)를 커밋해 두므로
# 평소 빌드에는 필요 없다 — 워크스페이스에서 뺀다.
exclude = ["scripts/onnxgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1"
# ML 엔진: burn 0.21 안정판. CPU = ndarray, GPU = wgpu(Vulkan/DX12/Metal — 드라이버 SDK 불필요)
burn = { version = "0.21", default-features = false }
safetensors = "0.8"
# ONNX 내보내기의 protobuf 런타임. 생성 코드(`nl-engine/src/onnx/pb.rs`)를 커밋해 두므로
# 빌드에 prost-build 도 protoc 도 필요 없다 — 런타임 크레이트만 쓴다.
prost = "0.14"
# ONNX 내보내기 검증 전용(dev-dependency). 배포 바이너리에는 들어가지 않는다 — 넣으면 +34 MiB 다.
tract-onnx = "0.23"
base64 = "0.22"
memmap2 = "0.9"
# 장치 열거용 wgpu — burn(cubecl-wgpu)이 쓰는 것과 같은 메이저 버전이어야 한다.
wgpu = "29"
pollster = "0.4"
half = "2"
# GUI (trust-pms 와 동일 세대)
eframe = { version = "0.36.1", default-features = false }
egui = "0.36"
egui_extras = "0.36"
egui_plot = "0.37"
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
winit = { version = "0.30", default-features = true }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
# IO 어댑터
# 화면 캡처: Windows 는 xcap, Linux 는 순수 Rust(x11rb + wlr-screencopy) — 시스템 개발 라이브러리 불필요
xcap = "0.9"
x11rb = { version = "0.14", features = ["randr"] }
libwayshot = { version = "0.9", default-features = false, features = ["png"] }
enigo = { version = "0.6", default-features = false }
# xdg-desktop-portal 호출(GNOME/KDE Wayland 화면 캡처). 순수 Rust — 시스템 개발 라이브러리 불필요.
# default = ["async-io", "blocking-api"] 그대로 쓴다(블로킹 API, tokio 없음).
zbus = "5"
ureq = { version = "3", features = ["json"] }
# WebSocket 소스/싱크. rustls TLS 로 wss:// 지원 — 시스템 개발 라이브러리 불필요
# (webpki-roots 내장 인증서를 쓰므로 OS 인증서 저장소도 필요 없다).
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tiny_http = "0.12"
# HTTP 서버 노드의 TLS(선택). ureq·tungstenite 가 이미 끌어오는 것과 **같은 0.23** 을 쓰고,
# 암호 제공자도 트리에 이미 있는 ring 으로 맞춘다 — 기본값인 aws-lc-rs 는 cmake·nasm 을 요구해
# "시스템 개발 라이브러리 없이 빌드된다" 는 이 저장소의 전제를 깬다.
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "ring"] }
# 시험에서만 쓴다 — 자체 서명 인증서를 만들어 진짜 TLS 왕복을 돌린다.
# 기본 기능이 ring 이라 여기서도 aws-lc-rs 가 따라오지 않는다.
rcgen = "0.14"
sysinfo = "0.39"
csv = "1"
# 명령줄 도구(nl-cli)
clap = { version = "4", features = ["derive"] }
directories = "6"
sha2 = "0.10"
sha1 = "0.10"
semver = "1"
minisign-verify = "0.2"
# 시험에서만 쓴다 — 진짜 키를 만들어 매니페스트에 서명해 fail-closed 경로를 끝까지 돈다.
minisign = "0.9"
zip = { version = "6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
libc = "0.2"
# Windows 실행 파일에 아이콘·버전 정보를 박는다. build.rs 가 Windows 대상일 때만 쓴다.
winresource = "0.1"
# Windows 콘솔 붙잡기에만 쓴다 (GUI 서브시스템 앱의 --version 출력).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"


# 보안 리뷰 권고: 우리 크레이트는 릴리스에서도 정수 오버플로를 패닉으로 잡는다(외부 입력 파싱 경로).
# burn/ndarray 같은 의존성은 성능 때문에 제외.
[profile.release.package.nl-core]
overflow-checks = true
[profile.release.package.nl-engine]
overflow-checks = true
[profile.release.package.nl-io]
overflow-checks = true
[profile.release.package.nl-gui]
overflow-checks = true
[profile.release.package.nl-bundle]
overflow-checks = true
[profile.release.package.nl-update]
overflow-checks = true
[profile.release.package.nl-app]
overflow-checks = true
[profile.release.package.nl-runtime]
overflow-checks = true
[profile.release.package.nl-cli]
overflow-checks = true

# 디버그 빌드에서 순환 레이어 시각 루프가 opt-level 0 이면 19배 느리다 — 로컬 크레이트도 최적화
[profile.dev.package.nl-engine]
opt-level = 2

# 디버그 빌드에서도 텐서 연산은 최적화 (학습 루프가 못 참을 만큼 느려지지 않게)
[profile.dev.package."*"]
opt-level = 2
