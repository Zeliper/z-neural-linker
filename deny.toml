# cargo-deny 설정 — 의존성 감사.
#
#   cargo deny check            # 전부
#   cargo deny check licenses   # 라이선스만
#   cargo deny check advisories # 취약·미유지보수만
#
# CI 는 `licenses` 만 실패로 다룬다. 라이선스는 **우리가 고를 수 있는 것**이고 어기면 배포가
# 막히지만, advisory 는 남이 공개하는 순간 늘어나므로 빨간불로 만들면 우리 잘못이 아닌 일로
# 파이프라인이 멈춘다. advisory 는 경고로 보고 사람이 판단한다 (`.github/workflows/ci.yml`).

[graph]
# 우리가 실제로 배포하는 대상만 본다. 다른 운영체제 전용 의존성까지 끌어와 보면
# 여기서는 쓰지도 않는 크레이트 때문에 실패한다.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
# 우리가 **직접** 의존하는 것의 미유지보수만 실패로 본다.
#
# 상위 의존성이 끌고 오는 것(burn 이 쓰는 bincode·paste, eframe 이 쓰는 ttf-parser)은 우리가
# 바꿀 수 없다. 그걸로 빨간불을 내면 남의 사정으로 파이프라인이 멈추고, 결국 아무도 안 보게 된다.
# 직접 의존성은 우리가 바꿀 수 있으므로 그건 막는다.
unmaintained = "workspace"
# 무시하는 advisory 는 여기에 이유와 함께 적는다. 지금은 없다 —
# 미유지보수 경고 넷은 전부 상위 의존성(burn·eframe)이 끌고 오는 것이라 우리가 바꿀 수 없고,
# 그 판단은 `docs/reviews/deps-2026-09-14.md` 에 적어 두었다.
ignore = []

[licenses]
version = 2
# 배포물에 넣어도 되는 것만. 전부 허용적(permissive) 라이선스다.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # 글꼴 라이선스. `epaint_default_fonts` 가 기본 글꼴을 함께 담고 있어 들어온다.
    # 둘 다 재배포를 허용하고, 글꼴 자체를 파는 것만 막는다 — 우리 용도와 어긋나지 않는다.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # 루트 인증서 **데이터** 라이선스(`webpki-roots`). 코드가 아니라 자료라서 코드 라이선스가
    # 아닌 CDLA 를 쓴다. 허용적이고 재배포에 조건이 없다.
    "CDLA-Permissive-2.0",
]
# GPL 계열은 적지 않는다. `allow` 목록에 없으면 거부이므로 따로 `deny` 를 두지 않아도 막힌다 —
# 목록을 한 군데만 두는 편이 어긋날 일이 없다. (GPL·AGPL·LGPL 은 정적 링크 배포와 맞지 않는다.)
confidence-threshold = 0.9

[bans]
# 같은 크레이트의 메이저 버전이 둘 이상이면 알린다. 빌드가 커지고, 타입이 달라
# "같은 타입인데 안 맞는다" 는 오류가 난다. 지금 트리에는 실제로 몇 쌍이 있다 —
# 대부분 상위 의존성이 서로 다른 버전을 요구해서이고, 목록과 판단은 리뷰 문서에 있다.
multiple-versions = "warn"
# crates.io 의 `foo = "*"` 를 막는다. 버전을 고정하지 않은 의존성은 언제 무엇이 들어올지 모른다.
#
# 워크스페이스 안의 `path` 의존성은 버전을 적지 않는 것이 정상이라 `allow-wildcard-paths` 로
# 봐준다. 이 옵션은 **발행 가능한 크레이트에는 적용되지 않으므로** 우리 크레이트에는 전부
# `publish = false` 가 붙어 있어야 한다 — 어차피 crates.io 에 올리지 않는다.
wildcards = "deny"
allow-wildcard-paths = true
# 빌드 시간과 공급망 표면을 줄이려고 일부러 피하는 것들.
deny = [
    # OpenSSL 을 시스템에서 찾게 되면 "개발 패키지 없이 빌드된다" 는 전제가 깨진다.
    { crate = "openssl-sys", reason = "시스템 OpenSSL 대신 rustls 를 쓴다" },
]

[sources]
# crates.io 말고 다른 곳에서 받아 오는 것이 있으면 막는다. git 의존성은 잠금이 약하고
# 공급망 감사도 어렵다.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
