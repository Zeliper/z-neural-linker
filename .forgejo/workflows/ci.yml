# push·PR 마다 포맷·린트·테스트. Forgejo Actions 는 GitHub 문법을 그대로 읽으므로
# `.forgejo/workflows/ci.yml` 에 같은 파일이 있다 (둘을 함께 고쳐야 한다).
#
# Forgejo 에서 돌리려면 인스턴스 `app.ini` 에 액션 기본 주소가 있어야 한다:
#   [actions]
#   DEFAULT_ACTIONS_URL = github
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 앞의 실행을 접는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 경고를 오류로. clippy 단계와 별개로 rustc 경고도 막는다.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 시스템 의존 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 \
            libvulkan1 mesa-vulkan-drivers \
            fonts-noto-cjk
        # libxkbcommon0: enigo 가 링크하는 런타임 라이브러리. 개발 패키지는 필요 없다 —
        #   crates/nl-io/build.rs 가 링크 이름을 OUT_DIR 심볼릭 링크로 만들어 준다.
        # mesa-vulkan-drivers: lavapipe(소프트웨어 래스터라이저). egui_kittest 스냅샷이
        #   wgpu 어댑터를 요구하는데 러너에는 GPU 가 없다. kittest 는 CPU 어댑터를 먼저 고른다.
        # fonts-noto-cjk: 런타임 스냅샷이 쓰는 글꼴. 판본이 다르면 그 테스트만 조용히 건너뛴다.

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
      - name: 포맷 검사
        run: cargo fmt --all -- --check

      - name: 클리피
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 테스트
        env:
          # 스냅샷 테스트가 렌더 백엔드 없이 조용히 통과하지 않게 한다.
          # 글꼴이 없어서 건너뛰는 것은 이 변수로도 실패하지 않는다 (배포판마다 판본이 달라 강제할 수 없다).
          NL_SNAPSHOT_REQUIRED: "1"
        run: cargo test --workspace

      # 배포 런타임은 사용자 PC 에서 단독으로 도는 바이너리다. 릴리스 빌드가 깨지면
      # 테스트가 다 통과해도 배포가 막히므로 여기서 같이 본다.
      - name: 릴리스 빌드 (배포 런타임)
        run: cargo build --release -p nl-runtime

  # Windows 는 배포 대상이라 실기에서 한 번은 돌려 봐야 한다.
  # 개발 기계에서는 `cargo xwin` 으로 컴파일만 확인할 수 있고, 소켓 타임아웃·경로·권한처럼
  # 실제로 돌려 봐야 아는 것들이 남는다. 그 공백을 이 잡이 메운다.
  #
  # `check` 잡과 따로 둔다. 여기서 깨져도 Linux 결과는 그대로 보이는 편이 고치기 쉽다.
  #
  # Forgejo 쪽 주의: 두 파일을 바이트 동일로 두기 때문에 이 잡이 Forgejo 에도 그대로 간다.
  # 인스턴스에 `windows-latest` 라벨을 가진 러너가 없으면 이 잡은 배정되지 않고 계속 대기한다.
  # Windows 러너를 붙이거나, 그때까지는 Forgejo 에서 이 잡을 무시하도록 운영하면 된다.
  windows:
    runs-on: windows-latest
    # Windows 러너는 Linux 보다 느리고, burn·wgpu 트리를 처음 받으면 오래 걸린다.
    timeout-minutes: 90
    # 기본값이지만 적어 둔다 — 여기서 깨지면 CI 전체가 빨간불이어야 한다는 뜻이다.
    # `check` 와 서로 `needs` 가 없어 나란히 도니, 이 잡이 깨져도 Linux 결과는 끝까지 나온다.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # nl-gui·nl-runtime 도 돈다. 스냅샷은 어댑터나 CJK 글꼴이 없으면 **스스로 건너뛰고**,
      # 여기서는 `NL_SNAPSHOT_REQUIRED` 를 켜지 않는다 — 러너의 GPU 가 불확실해서 켜면
      # 환경 문제로 빨간불이 난다. 골든을 지키는 일은 Linux 잡(lavapipe + Noto CJK)이 맡고,
      # 이 잡은 "Windows 에서 컴파일되고 GUI 아닌 로직이 도는가" 를 본다.
      # nl-app 은 아직 뺀다 — 뷰 스냅샷이 많아 얻는 것보다 빌드 시간이 크다.
      # GPU 게이트 테스트는 환경 변수를 주지 않으므로 스스로 건너뛴다.
      #
      # `--release` 없이 디버그로 돌린다. 이 워크스페이스는 `[profile.dev.package."*"] opt-level = 2`
      # 라 burn·ndarray 같은 의존성이 디버그에서도 최적화되어 있다. 가장 무거운 nl-engine 조차
      # 개발 기계에서 테스트 실행에 49 초밖에 안 걸리므로(빌드 시간 제외), 릴리스로 바꿔 봐야
      # 컴파일만 길어지고 얻는 것이 없다. 오래 걸리는 쪽은 테스트가 아니라 빌드이고, 그건
      # rust-cache 가 맡는다.
      - name: 테스트
        run: >
          cargo test
          -p nl-core -p nl-io -p nl-cli -p nl-bundle -p nl-update -p nl-engine
          -p nl-gui -p nl-runtime

  # 의존성 감사. `check` 와 따로 두고 **빨간불을 내지 않는다**.
  #
  # advisory 는 남이 공개하는 순간 늘어난다. 우리가 한 줄도 안 고쳤는데 어제 초록이던 것이
  # 오늘 빨강이 되고, 그런 실패가 반복되면 아무도 안 보게 된다. 그래서 `continue-on-error: true`
  # 로 두고 사람이 판단한다 — 판단 결과는 `docs/reviews/deps-<날짜>.md` 에 남긴다.
  #
  # 라이선스만은 다르다. 그건 **우리가 고르는 것**이고 어기면 배포가 막히므로,
  # `cargo deny check licenses` 는 이 잡 안에서 실패로 다룬다(아래 단계가 그것만 따로 돈다).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 라이선스 위반은 배포를 막는 문제라 여기서 끝낸다. 설정은 저장소 루트의 `deny.toml`.
      - name: 라이선스 (cargo deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

      # 취약·미유지보수·중복 버전은 알리기만 한다.
      - name: advisories·중복 버전 (cargo deny)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans

      # cargo-deny 와 겹치지만 advisory DB 를 직접 보고 사람이 읽기 좋은 표를 낸다.
      # 둘 중 하나가 막혀도 나머지가 도는 편이 낫다.
      - name: cargo audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
