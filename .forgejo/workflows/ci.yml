# push·PR 마다 포맷·린트·테스트. Forgejo Actions 는 GitHub 문법을 그대로 읽으므로
# `.forgejo/workflows/ci.yml` 에 같은 파일이 있다 (둘을 함께 고쳐야 한다).
#
# Forgejo 에서 돌리려면 인스턴스 `app.ini` 에 액션 기본 주소가 있어야 한다:
#   [actions]
#   DEFAULT_ACTIONS_URL = github
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 앞의 실행을 접는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 경고를 오류로. clippy 단계와 별개로 rustc 경고도 막는다.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 시스템 의존 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 \
            libvulkan1 mesa-vulkan-drivers \
            fonts-noto-cjk
        # libxkbcommon0: enigo 가 링크하는 런타임 라이브러리. 개발 패키지는 필요 없다 —
        #   crates/nl-io/build.rs 가 링크 이름을 OUT_DIR 심볼릭 링크로 만들어 준다.
        # mesa-vulkan-drivers: lavapipe(소프트웨어 래스터라이저). egui_kittest 스냅샷이
        #   wgpu 어댑터를 요구하는데 러너에는 GPU 가 없다. kittest 는 CPU 어댑터를 먼저 고른다.
        # fonts-noto-cjk: 런타임 스냅샷이 쓰는 글꼴. 판본이 다르면 그 테스트만 조용히 건너뛴다.

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 아직 전체 포맷을 적용하지 않았다. 다른 에이전트가 작업 중인 크레이트를 건드리지 않으려고
      # 지금은 보고만 하고 빨간불을 내지 않는다. 포맷이 한 번 정리되면 continue-on-error 를 뺀다.
      - name: 포맷 검사 (아직 강제하지 않음)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: 클리피
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 테스트
        env:
          # 스냅샷 테스트가 렌더 백엔드 없이 조용히 통과하지 않게 한다.
          # 글꼴이 없어서 건너뛰는 것은 이 변수로도 실패하지 않는다 (배포판마다 판본이 달라 강제할 수 없다).
          NL_SNAPSHOT_REQUIRED: "1"
        run: cargo test --workspace

      # 배포 런타임은 사용자 PC 에서 단독으로 도는 바이너리다. 릴리스 빌드가 깨지면
      # 테스트가 다 통과해도 배포가 막히므로 여기서 같이 본다.
      - name: 릴리스 빌드 (배포 런타임)
        run: cargo build --release -p nl-runtime
